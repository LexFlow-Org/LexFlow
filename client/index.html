<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- SECURITY FIX (Audit 2026-03-14): CSP aligned with tauri.conf.json.
         Removed 'unsafe-inline' from script-src — Tauri v2 auto-generates nonces for
         inline scripts present at build time.  Added object-src/frame-ancestors from
         tauri.conf.json that were missing here.  This meta tag is a fallback if Tauri's
         injected CSP fails to load; it should be equally strict. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; 
                   script-src 'self'; 
                   style-src 'self' 'unsafe-inline'; 
                   img-src 'self' data: blob:; 
                   font-src 'self' data:;
                   worker-src 'self' blob:;
                   connect-src ipc: http://ipc.localhost; 
                   object-src 'none';
                   base-uri 'self';
                   form-action 'self';
                   frame-ancestors 'none';" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LexFlow</title>
    <!-- Keep critical styles external: an inline style makes Tauri add a CSP
         nonce that blocks the runtime style elements used by toast messages. -->
    <link rel="stylesheet" href="/src/styles/bootstrap.css" />
    <!-- ★ Tema istantaneo: applica PRIMA di qualsiasi rendering per evitare flash nero→bianco -->
    <script type="module" src="/src/theme-bootstrap.js"></script>
  </head>
  <body class="antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
