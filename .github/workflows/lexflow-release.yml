# LexFlow Release Pipeline v3.0 -- Node 24, no gitleaks
# Pure ASCII -- no Unicode (GitHub YAML parser compatibility)
name: Release LexFlow - Suite Legale
run-name: "Release LexFlow - Suite Legale"

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  RUST_BACKTRACE: 1
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"

jobs:
  # ---------------------------------------------------------
  # 1. PRE-FLIGHT -- Quality Gate & Release Controller
  # ---------------------------------------------------------
  pre-flight:
    name: "Pre-flight: Quality Gate & Release Draft"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.get_version.outputs.TAG }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy, rustfmt

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ./src-tauri -> target
          shared-key: preflight

      - name: Remove local cargo config (CI uses default linker)
        run: rm -f src-tauri/.cargo/config.toml

      - name: Install dependencies
        run: npm ci && cd client && npm ci --legacy-peer-deps

      - name: Native release policy regression tests
        run: python3 scripts/test-native-hardening.py

      - name: Fetch typst sidecar (Linux)
        run: |
          set -e
          mkdir -p src-tauri/binaries
          ASSET="typst-x86_64-unknown-linux-musl.tar.xz"
          TAURI_NAME="typst-x86_64-unknown-linux-gnu"
          OUT="src-tauri/binaries/$TAURI_NAME"
          if [ -f "$OUT" ]; then
            echo "Typst sidecar $OUT already exists"; exit 0
          fi
          URL="https://github.com/typst/typst/releases/latest/download/$ASSET"
          echo "Downloading $URL"
          WORKDIR=$(mktemp -d)
          curl -fSL -o "$WORKDIR/$ASSET" "$URL"
          tar -xJf "$WORKDIR/$ASSET" -C "$WORKDIR"
          EXTRACTED="$WORKDIR/typst-x86_64-unknown-linux-musl/typst"
          if [ ! -f "$EXTRACTED" ]; then
            echo "ERROR: typst binary not found at expected path $EXTRACTED"
            echo "Archive contents:"; tar -tJf "$WORKDIR/$ASSET"
            exit 1
          fi
          cp "$EXTRACTED" "$OUT"
          chmod +x "$OUT"
          strip "$OUT" 2>/dev/null || true
          echo "Typst sidecar ready: $OUT ($(wc -c < "$OUT") bytes)"
          rm -rf "$WORKDIR"

      - name: Fetch qpdf sidecar (Linux)
        run: |
          set -e
          mkdir -p src-tauri/binaries
          OUT="src-tauri/binaries/qpdf-x86_64-unknown-linux-gnu"
          if [ -f "$OUT" ]; then echo "qpdf sidecar already exists"; exit 0; fi
          VERSION=$(curl -s https://api.github.com/repos/qpdf/qpdf/releases/latest | grep '"tag_name"' | sed 's/.*"v\?\(.*\)".*/\1/')
          URL="https://github.com/qpdf/qpdf/releases/download/v${VERSION}/qpdf-${VERSION}-bin-linux-x86_64.zip"
          echo "Downloading qpdf $VERSION from $URL"
          WORKDIR=$(mktemp -d)
          curl -fSL -o "$WORKDIR/qpdf.zip" "$URL"
          unzip -q "$WORKDIR/qpdf.zip" -d "$WORKDIR/qpdf"
          EXTRACTED=$(find "$WORKDIR/qpdf" -name "qpdf" -type f | head -1)
          if [ -z "$EXTRACTED" ]; then echo "ERROR: qpdf binary not found"; ls -R "$WORKDIR/qpdf"; exit 1; fi
          cp "$EXTRACTED" "$OUT"
          chmod +x "$OUT"
          strip "$OUT" 2>/dev/null || true
          echo "qpdf sidecar ready: $OUT ($(wc -c < "$OUT") bytes)"
          rm -rf "$WORKDIR"

      - name: Determine Version Tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="v$(jq -r .version package.json)"
            echo "TAG=$VERSION" >> $GITHUB_OUTPUT
            echo "Workflow dispatch -- tag from package.json: $VERSION"
          else
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "Tag push detected: ${{ github.ref_name }}"
          fi

      - name: Version Validation
        run: |
          TAG="${{ steps.get_version.outputs.TAG }}"
          VER_PKG="v$(jq -r .version package.json)"
          VER_CARGO="v$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')"
          VER_TAURI="v$(jq -r .version src-tauri/tauri.conf.json)"
          VER_CLIENT="v$(jq -r .version client/package.json)"
          echo "Tag:         $TAG"
          echo "package.json:       $VER_PKG"
          echo "Cargo.toml:         $VER_CARGO"
          echo "tauri.conf.json:    $VER_TAURI"
          echo "client/package.json: $VER_CLIENT"
          MISMATCH=0
          if [ "$TAG" != "$VER_PKG" ]; then echo "MISMATCH: tag vs package.json"; MISMATCH=1; fi
          if [ "$TAG" != "$VER_CARGO" ]; then echo "MISMATCH: tag vs Cargo.toml"; MISMATCH=1; fi
          if [ "$TAG" != "$VER_TAURI" ]; then echo "MISMATCH: tag vs tauri.conf.json"; MISMATCH=1; fi
          if [ "$TAG" != "$VER_CLIENT" ]; then echo "MISMATCH: tag vs client/package.json"; MISMATCH=1; fi
          if [ "$MISMATCH" -eq 1 ]; then echo "ERROR: Version mismatch detected. Aborting."; exit 1; fi
          echo "All versions match: $TAG"

      - name: Quality Gate -- cargo check + clippy + fmt
        working-directory: src-tauri
        run: |
          cargo check --release 2>&1
          cargo clippy --release -- -D warnings 2>&1
          cargo fmt --check 2>&1

      - name: Quality Gate -- PUBLIC_KEY_BYTES coherence (build.rs vs license.rs)
        working-directory: src-tauri
        run: |
          # -A8 covers any cargo fmt layout (14+14+4, 16+16, 8 per line, etc.)
          # — captures from the marker line up to and through the closing `]` line.
          BUILD_KEY=$(grep -A8 'PUBLIC_KEY_BYTES.*must match' build.rs | grep -o '[0-9]\+u8' | tr '\n' ',')
          LICENSE_KEY=$(grep -A8 'pub(crate) const PUBLIC_KEY_BYTES' src/license.rs | grep -o '[0-9]\+u8' | tr '\n' ',')
          if [ "$BUILD_KEY" != "$LICENSE_KEY" ]; then
            echo "::error::PUBLIC_KEY_BYTES mismatch between build.rs and license.rs!"
            echo "build.rs:   $BUILD_KEY"
            echo "license.rs: $LICENSE_KEY"
            exit 1
          fi
          echo "✓ PUBLIC_KEY_BYTES match in build.rs and license.rs"

      - name: Quality Gate -- cargo test (security tests + key coherence)
        working-directory: src-tauri
        run: cargo test --lib --release 2>&1

      - name: Quality Gate -- ESLint
        working-directory: client
        run: npx eslint . --max-warnings 0

      - name: Quality Gate -- Vite build
        working-directory: client
        run: npm run build

      - name: Dependency Audit -- cargo audit + npm audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock
          cd client && npm audit --omit=dev --audit-level=high

      - name: License Check -- cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3fd3802e88374d3fe9159b834c7714ec57d6c979 # v2.0.15
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check licenses
          arguments: --config src-tauri/deny.toml
        continue-on-error: true

      - name: Create Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get_version.outputs.TAG }}"
          NOTES="Release in progress -- all platform builds running..."
          if [ -f CHANGELOG.md ]; then
            SECTION=$(awk "/^## \[${TAG#v}\]/{found=1;next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
            if [ -n "$SECTION" ]; then
              NOTES="$SECTION"
            fi
          fi
          printf '%s\n' "$NOTES" > /tmp/release-notes.md
          gh release create "$TAG" --draft --title "LexFlow $TAG" --notes-file /tmp/release-notes.md || echo "Release already exists."

  # ---------------------------------------------------------
  # 2. MACOS -- SEPARATE APPLE SILICON AND INTEL DMGS
  # ---------------------------------------------------------
  build-macos:
    name: "macOS: ${{ matrix.arch }} DMG"
    needs: pre-flight
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: Apple-Silicon
          - target: x86_64-apple-darwin
            arch: Intel
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.pre-flight.outputs.tag }}
      MACOS_TARGET: ${{ matrix.target }}
      MACOS_ARCH: ${{ matrix.arch }}
      MACOS_SBOM: lexflow-macos-${{ matrix.arch }}-sbom.json
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Remove local cargo config (CI uses default linker)
        run: rm -f src-tauri/.cargo/config.toml

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ./src-tauri -> target
          shared-key: macos-${{ matrix.target }}

      - name: Install dependencies
        run: npm ci && cd client && npm ci --legacy-peer-deps

      - name: Fetch verified typst sidecars (both macOS architectures)
        run: ./scripts/fetch-macos-typst.sh

      - name: Build verified qpdf sidecars (both macOS architectures)
        run: ./scripts/build-macos-qpdf.sh --jobs 4

      - name: Verify macOS sidecar architectures and dependencies
        run: python3 scripts/verify-macos-sidecars.py

      - name: Build macOS DMG without uploading unfinished assets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./node_modules/.bin/tauri build --target "$MACOS_TARGET" --bundles dmg -- --locked

      - name: Add volume icon and stage the architecture-specific DMG
        run: |
          set -euo pipefail
          shopt -s nullglob
          DMG_FILES=("src-tauri/target/$MACOS_TARGET/release/bundle/dmg/"*.dmg)
          if [ "${#DMG_FILES[@]}" -ne 1 ]; then
            echo "Expected exactly one DMG for $MACOS_TARGET; found ${#DMG_FILES[@]}" >&2
            exit 1
          fi
          WORK_DIR=$(mktemp -d)
          MOUNT_POINT="$WORK_DIR/mount"
          MOUNTED=0
          cleanup() {
            if [ "$MOUNTED" -eq 1 ]; then
              hdiutil detach "$MOUNT_POINT" || return
            fi
            rm -rf "$WORK_DIR"
          }
          trap cleanup EXIT
          mkdir -p "$MOUNT_POINT" staging
          hdiutil convert "${DMG_FILES[0]}" -format UDRW -o "$WORK_DIR/writable.dmg"
          hdiutil attach "$WORK_DIR/writable.dmg" -nobrowse -mountpoint "$MOUNT_POINT"
          MOUNTED=1
          cp src-tauri/icons/dmg-icon.icns "$MOUNT_POINT/.VolumeIcon.icns"
          SetFile -a C "$MOUNT_POINT"
          hdiutil detach "$MOUNT_POINT"
          MOUNTED=0
          DMG_NAME="LexFlow-$RELEASE_TAG-macos-$MACOS_ARCH.dmg"
          hdiutil convert "$WORK_DIR/writable.dmg" -format UDZO -o "staging/$DMG_NAME"
          hdiutil verify "staging/$DMG_NAME"

      - name: Generate SBOM
        uses: anchore/sbom-action@17ae1740179002c89186b61233e0f892c3118b11
        with:
          path: ./
          format: cyclonedx-json
          output-file: ${{ env.MACOS_SBOM }}
          upload-artifact: false
          upload-release-assets: false

      - name: SHA256 Checksums & Upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DMG_NAME="LexFlow-$RELEASE_TAG-macos-$MACOS_ARCH.dmg"
          test -f "staging/$DMG_NAME"
          (cd staging && shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256")
          gh release upload "$RELEASE_TAG" "$MACOS_SBOM" "staging/$DMG_NAME" "staging/$DMG_NAME.sha256" --clobber

      - name: Attest Build Provenance (SLSA)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        continue-on-error: true
        with:
          subject-path: staging/LexFlow-*-macos-${{ matrix.arch }}.dmg

  # ---------------------------------------------------------
  # 3. WINDOWS NSIS -- Fixed WebView2 with AppContainer runtime ACLs
  # ---------------------------------------------------------
  build-windows:
    name: "Windows: NSIS Fixed WebView2"
    needs: pre-flight
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.pre-flight.outputs.tag }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ./src-tauri -> target
          shared-key: windows-nsis-fixed

      - name: Build Windows NSIS with pinned sidecars and fixed WebView2
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Visual Studio C++ Build Tools not found.' }
          & (Join-Path $vs 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          & ./scripts/build-windows.ps1 -Bundle nsis

      - name: Stage NSIS installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'staging' | Out-Null
          $installer = Get-ChildItem -Filter '*-setup.exe' -Path 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer not found after build.' }
          Copy-Item $installer.FullName "staging/LexFlow-$env:RELEASE_TAG-windows-x64-setup.exe"
          Write-Host "Fixed-runtime NSIS staged: $($installer.Length) bytes"

      - name: Generate SBOM & SHA256 Checksums & Upload
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx @cyclonedx/cyclonedx-npm --output-format JSON --output-file lexflow-windows-sbom.json
          gh release upload "$env:RELEASE_TAG" lexflow-windows-sbom.json --clobber
          Get-ChildItem -Filter "LexFlow-*-setup.exe" -Path "staging" | ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)" | Out-File "$($_.FullName).sha256" -Encoding ASCII
              gh release upload "$env:RELEASE_TAG" $_.FullName --clobber
              gh release upload "$env:RELEASE_TAG" "$($_.FullName).sha256" --clobber
          }

      - name: Attest Build Provenance (SLSA)
        continue-on-error: true
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: staging/LexFlow-*-setup.exe

  # ---------------------------------------------------------
  # 4. ANDROID APK + AAB (Secure RAM-Disk Signing)
  # ---------------------------------------------------------
  build-android:
    name: "Android: APK + AAB"
    needs: pre-flight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.pre-flight.outputs.tag }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Setup Java 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Setup Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ./src-tauri -> target
          shared-key: android

      - name: Install dependencies
        run: |
          npm ci && cd client && npm ci --legacy-peer-deps
          pip3 install Pillow --quiet

      - name: Remove local cargo config (CI safety)
        run: rm -f src-tauri/.cargo/config.toml

      - name: Build Android
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          npx tauri android init
          python3 scripts/harden-android.py
          # Copy custom Android icons + adaptive icon XML into the generated project.
          ANDROID_RES="src-tauri/gen/android/app/src/main/res"
          for dir in src-tauri/icons/android/mipmap-mdpi \
                     src-tauri/icons/android/mipmap-hdpi \
                     src-tauri/icons/android/mipmap-xhdpi \
                     src-tauri/icons/android/mipmap-xxhdpi \
                     src-tauri/icons/android/mipmap-xxxhdpi \
                     src-tauri/icons/android/mipmap-anydpi-v26 \
                     src-tauri/icons/android/values; do
            if [ -d "$dir" ]; then
              folder_name=$(basename "$dir")
              mkdir -p "$ANDROID_RES/$folder_name"
              cp -f "$dir"/* "$ANDROID_RES/$folder_name/" 2>/dev/null || true
              echo "Copied $folder_name"
            fi
          done
          npx tauri android build --config src-tauri/tauri.android.conf.json

      - name: Sign APK/AAB (Secure RAM-Disk Mode)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          trap 'if [ -f /dev/shm/release.keystore ]; then shred -u /dev/shm/release.keystore; echo "Keystore destroyed from RAM."; fi' EXIT
          echo "$KEYSTORE_BASE64" | base64 -d > /dev/shm/release.keystore
          BT=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -1)
          APK=$(find src-tauri/gen/android -name "*universal-release*.apk" | head -1)
          echo "Found APK: $APK"
          if [ -z "$APK" ]; then echo "ERROR: No APK found!"; find src-tauri/gen/android -name "*.apk" -o -name "*.aab" | sort; exit 1; fi
          python3 scripts/harden-android.py --verify-apk "$APK" --aapt "$BT/aapt"
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign \
            --ks /dev/shm/release.keystore \
            --ks-pass "env:ANDROID_STORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "env:ANDROID_KEY_PASSWORD" \
            --out "LexFlow-${RELEASE_TAG}-android.apk" \
            aligned.apk
          "$BT/apksigner" verify "LexFlow-${RELEASE_TAG}-android.apk"
          AAB=$(find src-tauri/gen/android -name "*release.aab" | head -1)
          echo "Found AAB: $AAB"
          if [ -z "$AAB" ]; then echo "ERROR: No AAB found!"; exit 1; fi
          # An AAB is a JAR/ZIP container: apksigner signs APKs only.
          jarsigner \
            -keystore /dev/shm/release.keystore \
            -storepass:env ANDROID_STORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            -signedjar "LexFlow-${RELEASE_TAG}-android.aab" \
            "$AAB" "$ANDROID_KEY_ALIAS"
          jarsigner -verify "LexFlow-${RELEASE_TAG}-android.aab"
          rm -f aligned.apk
          echo "Signing complete. Trap EXIT will shred keystore automatically."

      - name: SHA256 Checksums & Upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in LexFlow-*.apk LexFlow-*.aab; do
            sha256sum "$file" > "$file.sha256"
            gh release upload "$RELEASE_TAG" "$file" --clobber
            gh release upload "$RELEASE_TAG" "$file.sha256" --clobber
          done

      - name: Attest Build Provenance (SLSA)
        continue-on-error: true
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: LexFlow-*.apk

  # ---------------------------------------------------------
  # 5. PUBLISH RELEASE (only if ALL builds succeed)
  # ---------------------------------------------------------
  publish-release:
    name: "Publish Release"
    needs: [pre-flight, build-macos, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: always() && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' && needs.build-android.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Publish Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.pre-flight.outputs.tag }}
        run: |
          TAG="${{ needs.pre-flight.outputs.tag }}"
          if [ -f CHANGELOG.md ]; then
            SECTION=$(awk "/^## \[${TAG#v}\]/{found=1;next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
            if [ -n "$SECTION" ]; then
              printf '%s\n' "$SECTION" > /tmp/release-notes.md
            else
              echo "Release $TAG" > /tmp/release-notes.md
            fi
          else
            echo "Release $TAG" > /tmp/release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --notes-file /tmp/release-notes.md
          echo "Release $RELEASE_TAG published successfully!"

  # ---------------------------------------------------------
  # 6. ROLLBACK (if any build fails, delete the draft)
  # ---------------------------------------------------------
  rollback:
    name: "Rollback: Cleanup Failed Release"
    needs: [pre-flight, build-macos, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: always() && (needs.build-macos.result == 'failure' || needs.build-windows.result == 'failure' || needs.build-android.result == 'failure')
    steps:
      - name: Delete Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.pre-flight.outputs.tag }}
        run: |
          echo "Build failed -- cleaning up draft release $RELEASE_TAG"
          gh release delete "$RELEASE_TAG" --yes 2>/dev/null || echo "No draft to delete."
          echo "Rollback complete. Fix the issue and re-trigger."
